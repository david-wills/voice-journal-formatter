[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-journal-formatter"
version = "0.1.0"
description = "Turn raw voice transcripts into formatted Markdown notes, locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["obsidian", "voice", "transcription", "ollama", "local-llm", "journal"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
voice-journal-formatter = "voice_journal_formatter.cli:main"
vjf = "voice_journal_formatter.cli:main"

[tool.setuptools.packages.find]
include = ["voice_journal_formatter*"]
